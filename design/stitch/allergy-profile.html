<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Allergy Profile Creation</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config from Guidance -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#2e3132",
                        "on-surface-variant": "#44474c",
                        "inverse-on-surface": "#f0f1f2",
                        "on-primary-fixed-variant": "#3d4757",
                        "on-secondary-fixed": "#002113",
                        "tertiary-container": "#543d00",
                        "secondary": "#006c49",
                        "on-primary-container": "#a3adc0",
                        "primary-container": "#374151",
                        "on-primary-fixed": "#121c2a",
                        "surface-container-highest": "#e1e3e4",
                        "on-tertiary-fixed": "#261a00",
                        "surface-bright": "#f8f9fa",
                        "on-secondary-container": "#00714d",
                        "on-secondary-fixed-variant": "#005236",
                        "background": "#f8f9fa",
                        "secondary-container": "#6cf8bb",
                        "outline-variant": "#c5c6cc",
                        "tertiary-fixed": "#ffdf9f",
                        "primary": "#212b3a",
                        "secondary-fixed": "#6ffbbe",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#dba400",
                        "surface-container-low": "#f3f4f5",
                        "surface": "#f8f9fa",
                        "primary-fixed": "#d9e3f7",
                        "inverse-primary": "#bdc7db",
                        "primary-fixed-dim": "#bdc7db",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#5c4300",
                        "secondary-fixed-dim": "#4edea3",
                        "on-background": "#191c1d",
                        "tertiary": "#392800",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-tint": "#555f70",
                        "outline": "#75777d",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#f9bd22",
                        "surface-container": "#edeeef",
                        "surface-dim": "#d9dadb",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e1e3e4",
                        "surface-container-high": "#e7e8e9",
                        "on-surface": "#191c1d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap-sm": "8px",
                        "card-padding": "16px",
                        "touch-target": "44px",
                        "stack-gap-md": "16px",
                        "container-margin": "20px",
                        "stack-gap-lg": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom Toggle Switch Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: transparent;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: theme('colors.primary-container');
        }
        .toggle-checkbox:checked + .toggle-label:after {
            transform: translateX(100%);
            border-color: white;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- TopAppBar Shared Component -->
<!-- Suppressed BottomNavBar due to Transactional/Creation intent of this screen -->
<header class="bg-surface w-full sticky top-0 border-b border-outline-variant z-40">
<div class="flex items-center px-container-margin h-touch-target w-full max-w-md mx-auto">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center -ml-2 rounded-full hover:bg-surface-container-low transition-colors duration-200 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex-1 flex justify-center">
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">AllergySafe</span>
</div>
<div class="w-10"></div> <!-- Balancing spacer -->
</div>
</header>
<main class="w-full max-w-md mx-auto px-container-margin py-stack-gap-lg pb-32">
<!-- Page Title -->
<div class="mb-stack-gap-lg">
<h1 class="font-display text-display text-on-surface">Your Allergy Profile</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Select your allergens to build a personalized safety filter.</p>
</div>
<!-- Your Allergies Section -->
<section class="mb-stack-gap-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-gap-sm">Your Allergies</h2>
<div class="bg-surface-container-lowest border border-outline-variant rounded-[20px] p-card-padding">
<!-- Allergen Grid -->
<div class="flex flex-wrap gap-stack-gap-sm mb-6">
<!-- Selected Active Allergen (Peanut) -->
<button class="px-4 py-2 rounded-full border border-error bg-error-container text-on-error-container font-label-md text-label-md flex items-center gap-1.5 transition-all">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">nutrition</span>
                        Peanut
                        <span class="material-symbols-outlined text-[16px] ml-1">check</span>
</button>
<!-- Unselected Allergens -->
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-body-sm text-body-sm hover:bg-surface-container-low transition-colors">
                        Tree nuts
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-body-sm text-body-sm hover:bg-surface-container-low transition-colors">
                        Sesame
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-body-sm text-body-sm hover:bg-surface-container-low transition-colors">
                        Shellfish
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-body-sm text-body-sm hover:bg-surface-container-low transition-colors">
                        Fish
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-body-sm text-body-sm hover:bg-surface-container-low transition-colors">
                        Dairy
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-body-sm text-body-sm hover:bg-surface-container-low transition-colors">
                        Egg
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-body-sm text-body-sm hover:bg-surface-container-low transition-colors">
                        Wheat
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-body-sm text-body-sm hover:bg-surface-container-low transition-colors">
                        Soy
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-body-sm text-body-sm hover:bg-surface-container-low transition-colors">
                        Mango
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-body-sm text-body-sm hover:bg-surface-container-low transition-colors">
                        Mustard
                    </button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-body-sm text-body-sm hover:bg-surface-container-low transition-colors">
                        Sulfites
                    </button>
</div>
<!-- Expanded Details for Selected Allergen (Peanut Example) -->
<div class="bg-surface rounded-xl border border-outline-variant p-4 relative overflow-hidden">
<!-- Traffic Light Bar indicator (Red for severe risk default setup) -->
<div class="absolute top-0 left-0 w-full h-1 bg-error"></div>
<div class="flex items-center justify-between mb-4">
<span class="font-label-md text-label-md text-on-surface">Peanut Sensitivity</span>
<button class="text-outline hover:text-error transition-colors">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<!-- Severity Selection -->
<div class="mb-4">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-2">Severity</label>
<div class="flex bg-surface-container-low rounded-lg p-1 border border-outline-variant">
<button class="flex-1 py-1.5 rounded-md font-label-md text-label-md text-on-surface-variant text-center transition-colors">Mild</button>
<button class="flex-1 py-1.5 rounded-md font-label-md text-label-md text-on-surface-variant text-center transition-colors">Moderate</button>
<button class="flex-1 py-1.5 rounded-md bg-surface-container-lowest border border-outline-variant shadow-sm font-label-md text-label-md text-error text-center font-semibold transition-colors">Severe</button>
</div>
</div>
<!-- Cross-contact Toggle -->
<div class="flex items-center justify-between">
<div>
<span class="block font-label-md text-label-md text-on-surface">Cross-contact sensitive</span>
<span class="block font-body-sm text-[11px] text-on-surface-variant leading-tight mt-0.5">Alerts for "may contain" traces</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer toggle-checkbox" type="checkbox" value=""/>
<div class="w-11 h-6 bg-outline-variant rounded-full peer peer-focus:ring-2 peer-focus:ring-primary-fixed dark:bg-surface-variant toggle-label transition-colors duration-200 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
</label>
</div>
</div>
<div class="mt-6 text-center">
<button class="text-primary-container font-label-md text-label-md flex items-center justify-center gap-1 mx-auto hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[18px]">add</span>
                        Add Custom Allergen
                    </button>
</div>
</div>
</section>
<!-- Translation Section -->
<section class="mb-stack-gap-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-gap-sm">Translation Setup</h2>
<div class="bg-surface-container-lowest border border-outline-variant rounded-[20px] p-card-padding space-y-4">
<!-- Preferred Language -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-1" for="pref-language">Preferred Language</label>
<div class="relative">
<select class="w-full appearance-none bg-transparent border-0 border-b border-outline-variant px-0 py-2 font-body-md text-body-md text-on-surface focus:ring-0 focus:border-primary-container" id="pref-language">
<option selected="" value="en">English</option>
<option value="es">Español</option>
<option value="fr">Français</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Restaurant Language -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase mb-1 mt-2" for="rest-language">Destination Language (Optional)</label>
<div class="relative">
<select class="w-full appearance-none bg-transparent border-0 border-b border-outline-variant px-0 py-2 font-body-md text-body-md text-on-surface focus:ring-0 focus:border-primary-container" id="rest-language">
<option disabled="" selected="" value="">Select for travel...</option>
<option value="it">Italian</option>
<option value="ja">Japanese</option>
<option value="th">Thai</option>
</select>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant p-4 z-50">
<div class="max-w-md mx-auto">
<button class="w-full h-touch-target bg-primary-container text-on-primary rounded-xl font-label-md text-label-md flex items-center justify-center gap-2 hover:opacity-90 transition-opacity active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]">save</span>
                Save Profile
            </button>
</div>
</div>
</body></html>
