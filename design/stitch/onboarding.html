<style>
        /* Minimalist fade-in and slide-up animation for onboarding elements */
        @keyframes subtleSlideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-on-load > * {
            opacity: 0;
            animation: subtleSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .animate-on-load > *:nth-child(1) { animation-delay: 0.1s; }
        .animate-on-load > *:nth-child(2) { animation-delay: 0.2s; }
        .animate-on-load > *:nth-child(3) { animation-delay: 0.3s; }
        
        /* Scanning line animation */
        @keyframes scanLine {
            0% { transform: translateY(-100%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }
        
        .scan-animation {
            animation: scanLine 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
    </style>
<style>

<div class="absolute left-0 right-0 h-[1px] bg-secondary scan-animation shadow-[0_0_12px_rgba(0,108,73,0.6)]"></div>
</div>
<!-- Typography Hook -->

<h1 class="font-display text-display text-on-surface">
